# 安全版 compose：不引用任何第三方预编译镜像
#
# 与官方 docker-compose.yml 的差别只有两处：
#   1. artex 服务改为 build 本仓库，image 用本地 tag（不再拉 tomicdd/artex）
#   2. 8787 只绑定 127.0.0.1（原文件是 "8787:8787"，等于监听所有网卡）
#
# 用法（二选一）：
#   A. 本机已具备 Go/Node，先在宿主机编出二进制，再用原 Dockerfile 构建：
#        ( cd web && npm ci && npm run build:static )
#        rm -rf server/webui/dist && cp -r web/out server/webui/dist
#        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags embedui -trimpath -o dist/arm64/artex ./cmd/artex
#        docker compose -f docker-compose.safe.yml build
#   B. 完全从源码构建（不依赖任何预编译产物），改用 Dockerfile.fromsource：
#        docker build -f Dockerfile.fromsource -t catty:patched .
#
# 无论哪种，构建完成后务必核对容器内二进制的哈希是你自己产出的那份。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # 关键：不再 image: tomicdd/artex:${ARTEX_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile          # 换 Dockerfile.fromsource 可完全从源码构建
    image: catty:local                  # 本地自建 tag，不来自任何 registry
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      - "127.0.0.1:8787:8787"           # 原为 "8787:8787"，改为仅本机
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
